name: Gwen images auto-publish

# Robot automatique du site Gwen Services :
# des qu'une image arrive dans gwen-inbox/ (push sur main),
# elle est optimisee pour le web, renommee proprement, deplacee dans
# alliance-groupe-theme/assets/downloads/ag-gwen-services/assets/,
# puis le theme est release (bump version + rebuild zip + json) et
# pousse sur main -> le site live de Gwen se met a jour.

on:
  push:
    branches: [main]
    paths: ['gwen-inbox/**']
  workflow_dispatch:

concurrency:
  group: gwen-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Traiter les images de gwen-inbox
        id: process
        run: |
          python3 - <<'PY'
          import os, re, glob, unicodedata
          from PIL import Image, ImageOps

          ASSETS = "alliance-groupe-theme/assets/downloads/ag-gwen-services/assets"
          GAL    = os.path.join(ASSETS, "galerie")
          os.makedirs(GAL, exist_ok=True)

          def slugify(name):
              s = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", "-", s).strip("-")

          exts = (".jpg", ".jpeg", ".png", ".webp", ".heic", ".heif", ".bmp", ".tif", ".tiff")
          files = sorted(f for f in glob.glob("gwen-inbox/*") if f.lower().endswith(exts))
          count = 0
          for f in files:
              base = os.path.basename(f)
              name, ext = os.path.splitext(base)
              slug = slugify(name) or f"image-{count}"
              png  = ext.lower() == ".png"
              out_ext = "png" if png else "jpg"
              # hero.* et about.* = images speciales (fond + section a propos),
              # tout le reste alimente la galerie « En images ».
              if slug in ("hero", "about"):
                  out = os.path.join(ASSETS, f"{slug}.{out_ext}")
              else:
                  out = os.path.join(GAL, f"{slug}.{out_ext}")
              try:
                  im = ImageOps.exif_transpose(Image.open(f))
                  if png:
                      if im.mode not in ("RGB", "RGBA"):
                          im = im.convert("RGBA")
                  elif im.mode != "RGB":
                      im = im.convert("RGB")
                  if max(im.size) > 1920:
                      im.thumbnail((1920, 1920), Image.LANCZOS)
                  if png:
                      im.save(out, "PNG", optimize=True)          # EXIF non copie
                  else:
                      im.save(out, "JPEG", quality=82, optimize=True, progressive=True)
                  os.remove(f)
                  count += 1
                  print(f"OK : {base} -> {os.path.relpath(out, ASSETS)}")
              except Exception as e:
                  print(f"IGNORE ({e}) : {base}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"count={count}\n")
          print(f"{count} image(s) traitee(s)")
          PY

      - name: Release ag-gwen-services et push
        if: steps.process.outputs.count != '0'
        run: |
          CUR="$(grep -oP '"version": "\K[0-9]+\.[0-9]+\.[0-9]+' alliance-groupe-theme/assets/downloads/ag-gwen-services.json)"
          IFS=. read -r MA MI PA <<< "$CUR"
          NEW="$MA.$MI.$((PA+1))"
          echo "Version : $CUR -> $NEW"
          bash scripts/bump-template.sh ag-gwen-services "$NEW"
          git config user.name "gwen-images-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: images Gwen -> release ag-gwen-services v$NEW"
          git push origin main || { git pull --rebase origin main && git push origin main; }
